# ============================================================
# ПАКЕТ: ЦВЕТОЧНЫЙ СТЕЛЛАЖ (спальня, ESP32-C3 SuperMini)
# Подсветка полок, эффекты, настройки анимации.
#
# Прошивка: x18.flowers (ESP32-C3 SuperMini).
# MQTT-топики и состояния описаны в README.md.
#
# Проверено в Home Assistant и Yandex Smart Home (2026-10-20):
# конфиг валиден, сущности работают.
#
# Сущности light/switch экспортируются в Яндекс Умный Дом.
# Сущности number зависят от версии интеграции Yandex Smart Home
# и могут быть доступны только в Home Assistant.
# ============================================================

mqtt:

  # ---------- ОСВЕЩЕНИЕ ----------
  light:
    # Общий свет: включение/выключение всего стеллажа и глобальная яркость.
    - name: "Весь стеллаж"
      unique_id: flowers_full_light
      state_topic: "home/flat7/flowers/fullLight_state"
      command_topic: "home/flat7/flowers/fullLight"
      brightness_state_topic: "home/flat7/flowers/brightness_state"
      brightness_command_topic: "home/flat7/flowers/brightness"
      brightness_scale: 100
      payload_on: "ON"
      payload_off: "OFF"
      icon: "mdi:lightbulb-group"
      device: &flower_device
        identifiers: "bedroom_flower_rack"
        name: "Цветочный стеллаж"
        model: "ESP32-C3 SuperMini"
        manufacturer: "x18.flowers"
        suggested_area: "bedroom"

    # Полки 1..5 снизу вверх. У каждой — своё включение и яркость.
    # panel_N — только командный топик; состояние приходит из panel_N_state.
    # Дубль состояния в panel_N убран в прошивке, чтобы не было эхо-петли.
    - name: "Полка 1 (низ)"
      unique_id: flowers_panel_1
      state_topic: "home/flat7/flowers/panel_1_state"
      command_topic: "home/flat7/flowers/panel_1"
      brightness_state_topic: "home/flat7/flowers/panel_1/brightness_state"
      brightness_command_topic: "home/flat7/flowers/panel_1/brightness"
      brightness_scale: 100
      payload_on: "ON"
      payload_off: "OFF"
      icon: "mdi:lightbulb"
      device: *flower_device

    - name: "Полка 2"
      unique_id: flowers_panel_2
      state_topic: "home/flat7/flowers/panel_2_state"
      command_topic: "home/flat7/flowers/panel_2"
      brightness_state_topic: "home/flat7/flowers/panel_2/brightness_state"
      brightness_command_topic: "home/flat7/flowers/panel_2/brightness"
      brightness_scale: 100
      payload_on: "ON"
      payload_off: "OFF"
      icon: "mdi:lightbulb"
      device: *flower_device

    - name: "Полка 3"
      unique_id: flowers_panel_3
      state_topic: "home/flat7/flowers/panel_3_state"
      command_topic: "home/flat7/flowers/panel_3"
      brightness_state_topic: "home/flat7/flowers/panel_3/brightness_state"
      brightness_command_topic: "home/flat7/flowers/panel_3/brightness"
      brightness_scale: 100
      payload_on: "ON"
      payload_off: "OFF"
      icon: "mdi:lightbulb"
      device: *flower_device

    - name: "Полка 4"
      unique_id: flowers_panel_4
      state_topic: "home/flat7/flowers/panel_4_state"
      command_topic: "home/flat7/flowers/panel_4"
      brightness_state_topic: "home/flat7/flowers/panel_4/brightness_state"
      brightness_command_topic: "home/flat7/flowers/panel_4/brightness"
      brightness_scale: 100
      payload_on: "ON"
      payload_off: "OFF"
      icon: "mdi:lightbulb"
      device: *flower_device

    - name: "Полка 5 (верх)"
      unique_id: flowers_panel_5
      state_topic: "home/flat7/flowers/panel_5_state"
      command_topic: "home/flat7/flowers/panel_5"
      brightness_state_topic: "home/flat7/flowers/panel_5/brightness_state"
      brightness_command_topic: "home/flat7/flowers/panel_5/brightness"
      brightness_scale: 100
      payload_on: "ON"
      payload_off: "OFF"
      icon: "mdi:lightbulb"
      device: *flower_device

  # ---------- ВЫКЛЮЧАТЕЛИ: Группы и эффекты ----------
  switch:
    - name: "Верх стеллажа"
      unique_id: flowers_top_light
      state_topic: "home/flat7/flowers/topLight_state"
      command_topic: "home/flat7/flowers/topLight"
      payload_on: "ON"
      payload_off: "OFF"
      icon: "mdi:arrow-up-bold"
      device: *flower_device

    - name: "Низ стеллажа"
      unique_id: flowers_bottom_light
      state_topic: "home/flat7/flowers/bottomLight_state"
      command_topic: "home/flat7/flowers/bottomLight"
      payload_on: "ON"
      payload_off: "OFF"
      icon: "mdi:arrow-down-bold"
      device: *flower_device

    - name: "Режим Рассвет"
      unique_id: flowers_sunrise
      state_topic: "home/flat7/flowers/sunrise_state"
      command_topic: "home/flat7/flowers/sunrise"
      payload_on: "ON"
      payload_off: "OFF"
      icon: "mdi:weather-sunset-up"
      device: *flower_device

    # Прошивка не умеет останавливать «Дыхание»: startWave — momentary-триггер.
    # И ON, и OFF отправляют GO; startWave_state гаснет автоматически после
    # возврата последней полки. Так сущность остаётся управляемой из Яндекса.
    - name: "Эффект Волна"
      unique_id: flowers_wave
      state_topic: "home/flat7/flowers/startWave_state"
      command_topic: "home/flat7/flowers/startWave"
      payload_on: "GO"
      payload_off: "GO"
      icon: "mdi:waves"
      device: *flower_device

  # ---------- ЧИСЛА / НАСТРОЙКИ ----------
  # state_topic читает фактические значения из JSON-телеметрии status.
  # В Яндекс Умный Дом number-сущности могут не экспортироваться.
  number:
    - name: "Время розжига панели"
      unique_id: flowers_fade_time
      command_topic: "home/flat7/flowers/config/fadeTime"
      state_topic: "home/flat7/flowers/status"
      value_template: "{{ value_json.config.fade_s }}"
      min: 0.1
      max: 10.0
      step: 0.1
      mode: slider
      unit_of_measurement: "s"
      icon: "mdi:timer-outline"
      device: *flower_device

    - name: "Интервал между панелями"
      unique_id: flowers_interval
      command_topic: "home/flat7/flowers/config/interval"
      state_topic: "home/flat7/flowers/status"
      value_template: "{{ value_json.config.int_s }}"
      min: 0.0
      max: 5.0
      step: 0.1
      mode: slider
      unit_of_measurement: "s"
      icon: "mdi:clock-outline"
      device: *flower_device

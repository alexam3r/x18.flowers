; PlatformIO project configuration.
; Target board: ESP32-C3 SuperMini (esp32-c3-devkitm-1).
; The hardware is fixed: do not add/remove pins without a physical rework.

[platformio]
default_envs = esp32-c3-devkitm-1

[env:esp32-c3-devkitm-1]
platform = espressif32@8.0.0
board = esp32-c3-devkitm-1
framework = arduino

; USB-CDC console. The board is flashed/served over the native USB port.
monitor_speed = 115200
upload_speed = 115200

build_flags =
    -DBOARD_TYPE_C3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0

; Host-side unit tests for pure modules (CIE1931). Not flashed.
[env:native]
platform = native
test_framework = unity
test_build_src = no
build_src_filter = -<*>
